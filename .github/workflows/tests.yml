name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push cancels the run still going for the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    # ubuntu-24.04: GitHub has no Python 3.9 build for newer Ubuntu.
    # No macOS: its runners often wait hours for a machine on the free plan.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install fzf
        run: sudo apt-get update -q && sudo apt-get install -yq fzf
      - run: pip install '.[dev,webcam]'
      # a test stuck for 2 minutes prints where it is stuck
      - run: python -m pytest -q -o faulthandler_timeout=120

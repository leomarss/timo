[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timo-otp"
description = "timo (Time-based Identity Manager for OTPs): your authenticator app, in the terminal, one word away"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "cryptography>=42",
    "keyring>=25",
    "protobuf>=4.21,<7",
    "pyotp>=2.9",
    "pyperclip>=1.9",
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webcam = ["av>=14", "zxing-cpp>=2.3"]

[project.scripts]
timo = "timo.cli:main"

[project.urls]
Source = "https://github.com/leomarss/timo"

[tool.setuptools.dynamic]
version = {attr = "timo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"timo.protobuf" = ["migration.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

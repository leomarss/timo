[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "totp-cli"
description = "Terminal one-time password (TOTP) manager with fzf, encrypted storage and clipboard support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "cryptography>=42",
    "keyring>=25",
    "protobuf>=4.21,<7",
    "pyotp>=2.9",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webcam = ["av>=14", "zxing-cpp>=2.3"]

[project.scripts]
otpcli = "totp_cli.cli:main"

[project.urls]
Source = "https://github.com/leomarss/totp-cli"

[tool.setuptools.dynamic]
version = {attr = "totp_cli.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"totp_cli.protobuf" = ["migration.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

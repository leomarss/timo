[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timo-otp"
description = "Your authenticator app, in the terminal, one word away: an encrypted TOTP manager with fzf, QR import and export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Leonardo Martignoni" }]
keywords = ["2fa", "totp", "otp", "authenticator", "cli", "terminal", "fzf", "google-authenticator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "cryptography>=42",
    "keyring>=25",
    "protobuf>=4.21,<8",
    "pyotp>=2.9",
    "pyperclip>=1.9",
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
webcam = [
    "av>=14",
    # zxing-cpp 3.x has no Python 3.9 builds, so 3.9 stays on 2.x
    "zxing-cpp>=2.3,<3; python_version < '3.10'",
    "zxing-cpp>=2.3; python_version >= '3.10'",
]

[project.scripts]
timo = "timo.cli:main"

[project.urls]
Source = "https://github.com/leomarss/timo"
Issues = "https://github.com/leomarss/timo/issues"
Changelog = "https://github.com/leomarss/timo/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "timo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"timo.protobuf" = ["migration.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
